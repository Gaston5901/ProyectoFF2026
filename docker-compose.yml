services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto-final2026-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: proyecto_final2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - proyecto_final2026_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proyecto_final2026"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  proyecto_final2026_pgdata:
